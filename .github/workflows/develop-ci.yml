name: Frontend CI and promote develop

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-develop-promotion
  cancel-in-progress: true

jobs:
  test:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  promote:
    name: Merge develop into main
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge tested develop into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main develop
          git checkout -B main origin/main
          git merge --no-ff origin/develop -m "chore: promote tested develop to main"
          git push origin main
